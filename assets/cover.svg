<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7a87d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f7a87d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="560" rx="18" fill="#15161e"/>
  <rect x="24" y="24" width="1152" height="512" rx="12" fill="#1a1b26" stroke="#2c2f42" stroke-width="2"/>
  <circle cx="52" cy="52" r="6" fill="#2c2f42"/>
  <circle cx="72" cy="52" r="6" fill="#2c2f42"/>
  <circle cx="92" cy="52" r="6" fill="#2c2f42"/>
  <text x="116" y="57" fill="#878da9" font-size="14">maki</text>

  <!-- chat side -->
  <text x="56" y="112" fill="#878da9" font-size="15">&gt; open the file tree pane</text>
  <text x="56" y="150" fill="#dde0ea" font-size="15">The pane is docked on the right. Chat keeps the</text>
  <text x="56" y="174" fill="#dde0ea" font-size="15">keyboard, so you can keep typing while it is open.</text>
  <rect x="56" y="204" width="300" height="26" rx="6" fill="#20222e"/>
  <text x="70" y="222" fill="#878da9" font-size="14">bash</text>
  <text x="120" y="222" fill="#dde0ea" font-size="14">git status --short</text>
  <text x="70" y="258" fill="#abd695" font-size="14">M lua/file_tree.lua</text>
  <text x="70" y="282" fill="#abd695" font-size="14">?? plugin.toml</text>
  <text x="56" y="330" fill="#878da9" font-size="15">Alt-j / Alt-k move · Alt-l open · Alt-d delete</text>
  <text x="56" y="354" fill="#878da9" font-size="15">Alt-a new file · Alt-n new dir · Alt-E close</text>

  <!-- pane -->
  <rect x="700" y="80" width="440" height="430" rx="10" fill="#16161e" stroke="#2c2f42" stroke-width="2"/>
  <text x="716" y="70" fill="#f7a87d" font-size="14">maki-files</text>

  <rect x="712" y="96" width="416" height="26" rx="4" fill="#2c2f42"/>
  <text x="724" y="115" fill="#dde0ea" font-size="15">▾ maki-files</text>
  <text x="724" y="147" fill="#a2b5fa" font-size="15">  ▾ lua</text>
  <text x="724" y="173" fill="#878da9" font-size="15">    ◇</text>
  <text x="748" y="173" fill="#dde0ea" font-size="15">file_tree.lua</text>
  <text x="724" y="199" fill="#a2b5fa" font-size="15">  ▾ plugin</text>
  <text x="724" y="225" fill="#878da9" font-size="15">    ◇</text>
  <text x="748" y="225" fill="#dde0ea" font-size="15">file_tree.lua</text>
  <text x="724" y="251" fill="#878da9" font-size="15">  ▫</text>
  <text x="748" y="251" fill="#dde0ea" font-size="15">plugin.toml</text>
  <text x="724" y="277" fill="#878da9" font-size="15">  ≡</text>
  <text x="748" y="277" fill="#dde0ea" font-size="15">README.md</text>
  <text x="724" y="303" fill="#878da9" font-size="15">  ▣</text>
  <text x="748" y="303" fill="#dde0ea" font-size="15">assets</text>
  <text x="724" y="329" fill="#878da9" font-size="15">  ▪</text>
  <text x="748" y="329" fill="#dde0ea" font-size="15">LICENSE</text>
  <text x="724" y="355" fill="#878da9" font-size="15">  ▤</text>
  <text x="748" y="355" fill="#dde0ea" font-size="15">.gitignore</text>

  <line x1="712" y1="470" x2="1128" y2="470" stroke="#2c2f42" stroke-width="1"/>
  <text x="724" y="492" fill="#878da9" font-size="13">Alt-j/k move   Alt-l open   Alt-d del</text>

  <rect width="1200" height="560" rx="18" fill="url(#glow)"/>
</svg>
